name = "orakle-mirror"
compatibility_date = "2025-01-15"

# Cloudflare Workers Static Assets configuration for the Vite frontend.
#
# Production Git builds: `npm run build` then `npx wrangler deploy`
#   (package.json: deploy:cloudflare).
# Non-production / PR builds: `npm run build` then `npx wrangler versions upload`
#   (package.json: deploy:cloudflare:upload) so previews do not promote production.
#
# Without this explicit assets config, Wrangler tries to auto-detect/configure
# the Vite project and fails on Vite 5 with:
# "The version of Vite used in the project cannot be automatically configured."
#
# Keeping an explicit assets directory lets Wrangler deploy the already-built
# `dist/` output directly, without requiring a Vite 6 migration just to deploy.
preview_urls = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
